name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # una vez al día, para que los conciertos pasados salgan solos de "Próximos" (DECISIONS 2026-11-20)
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      # Sin dominio propio todavía: la web vive en /bruferri/. Al conectar bruferri.com, quitar BF_BASE y añadir CNAME.
      - run: node scripts/build.mjs
        env:
          BF_BASE: /bruferri/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
